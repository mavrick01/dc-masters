# DC-Masters Container Toolkit - LiteLLM Configuration

# General settings
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Temporarily disable database storage due to Prisma migration issues
  # store_model_in_db: true

# Model configurations
model_list:
  # Azure OpenAI - GPT Models
  - model_name: gpt-4
    litellm_params:
      model: azure/gpt-4
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY
      api_version: os.environ/AZURE_API_VERSION

  - model_name: gpt-35-turbo
    litellm_params:
      model: azure/gpt-35-turbo
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY
      api_version: os.environ/AZURE_API_VERSION

  # AWS Bedrock - Claude Models
  - model_name: claude-3-5-sonnet
    litellm_params:
      model: bedrock/anthropic.claude-3-5-sonnet-20241022-v2:0
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: os.environ/AWS_REGION_NAME

  - model_name: claude-3-opus
    litellm_params:
      model: bedrock/anthropic.claude-3-opus-20240229-v1:0
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: os.environ/AWS_REGION_NAME

  # Vertex AI - Gemini Models
  # Note: vertex_project and vertex_location are read from GCP_PROJECT_ID and GCP_REGION env vars
  - model_name: gemini-2-5-flash
    litellm_params:
      model: vertex_ai/gemini-2.5-flash
      vertex_credentials: /app/credentials/google_credentials.json

  - model_name: gemini-2-0-flash
    litellm_params:
      model: vertex_ai/gemini-2.0-flash
      vertex_credentials: /app/credentials/google_credentials.json

  # Vertex AI - Embeddings
  - model_name: text-embedding-004
    litellm_params:
      model: vertex_ai/text-embedding-004
      vertex_credentials: /app/credentials/google_credentials.json

# MCP Server Configuration
mcp_servers:
  # Stdio-based MCP Servers (npx command-based)
  - name: brave_search
    transport: stdio
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-brave-search"
    env:
      BRAVE_API_KEY: "${BRAVE_API_KEY}"  # Will be substituted from .env
      NODE_TLS_REJECT_UNAUTHORIZED: "${NODE_TLS_REJECT_UNAUTHORIZED:-0}"

  - name: filesystem_stdio
    transport: stdio
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-filesystem"
      - "/projects"

# Logging configuration
litellm_settings:
  drop_params: true
