

# DC-Masters Container Toolkit
# Supports both Docker and Podman

services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg17
    container_name: dc-masters-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-dcmasters}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme123}
      - POSTGRES_DB=${POSTGRES_DB:-litellm}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data:Z
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,Z
    ports:
      - "5432:5432"
    networks:
      - toolkit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dcmasters} -d ${POSTGRES_DB:-litellm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # LiteLLM AI Gateway
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: dc-masters-litellm
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - STORE_MODEL_IN_DB=True
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_LOG=${LITELLM_LOG:-info}
      - UI_USERNAME=${UI_USERNAME:-admin@dcmasters.local}
      - UI_PASSWORD=${UI_PASSWORD:-changeme123}
      - AZURE_API_KEY=${AZURE_API_KEY}
      - AZURE_API_BASE=${AZURE_API_BASE}
      - AZURE_API_VERSION=${AZURE_API_VERSION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION_NAME=${AWS_REGION_NAME}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_REGION=${GCP_REGION}
      - GOOGLE_APPLICATION_CREDENTIALS="/app/credentials/google_credentials.json"
      # Corporate firewall / SSL settings
      - SSL_VERIFY=${SSL_VERIFY:-true}
      - REQUESTS_CA_BUNDLE=${DC_REQUESTS_CA_BUNDLE:-/app/certs/company-ca.pem}
      - CURL_CA_BUNDLE=${DC_CURL_CA_BUNDLE:-/app/certs/company-ca.pem}
      - SSL_CERT_FILE=${DC_SSL_CERT_FILE:-/app/certs/company-ca.pem}
      - NODE_TLS_REJECT_UNAUTHORIZED=${DC_NODE_TLS_REJECT_UNAUTHORIZED}
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY:-postgres,mcp-searxng,searxng}
      - LITELLM_DROP_PARAMS=True
    volumes:
      - ./credentials:/app/credentials:ro,Z
      - ./certs:/app/certs:ro,Z
    ports:
      - "4000:4000"
    networks:
      - toolkit-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # N8N Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: dc-masters-n8n
    environment:
      # Database configuration
      - DB_TYPE=${DB_TYPE:-postgresdb}
      - DB_POSTGRESDB_HOST=${DB_POSTGRESDB_HOST:-postgres}
      - DB_POSTGRESDB_PORT=${DB_POSTGRESDB_PORT:-5432}
      - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE:-n8n}
      - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER:-dcmasters}
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD:-changeme123}
      # Timezone
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Singapore}
      - TZ=${TZ:-Asia/Singapore}
      # Owner account auto-setup (skips registration screen)
      - N8N_OWNER_EMAIL=${N8N_OWNER_EMAIL:-admin@dcmasters.local}
      - N8N_OWNER_FIRST_NAME=${N8N_OWNER_FIRST_NAME:-Admin}
      - N8N_OWNER_LAST_NAME=${N8N_OWNER_LAST_NAME:-User}
      - N8N_OWNER_PASSWORD=${N8N_OWNER_PASSWORD:-changeme123}
      # Additional settings
      - NODE_FUNCTION_ALLOW_EXTERNAL=pdf-parse
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # Google Cloud credentials
      - GOOGLE_APPLICATION_CREDENTIALS=/home/node/.n8n/credentials/google_credentials.json
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_REGION=${GCP_REGION}
      # Corporate firewall / SSL settings
      - NODE_TLS_REJECT_UNAUTHORIZED=${DC_NODE_TLS_REJECT_UNAUTHORIZED}
      - NODE_EXTRA_CA_CERTS=${DC_NODE_EXTRA_CA_CERTS:-/app/certs/company-ca.pem}
      - SSL_CERT_FILE=${DC_SSL_CERT_FILE:-/app/certs/company-ca.pem}
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY:-postgres,litellm,mcp-searxng,searxng}
      # LiteLLM integration settings
      # Runner configuration for n8n Workflows - using external mode to run in the same container but with better isolation and security controls, and to allow future flexibility to move to separate runner containers if needed
      - N8N_RUNNERS_MODE=internal
      - N8N_RUNNERS_AUTH_TOKEN=xZ3IRmkbIHLXO7lVmUsSedXqooIpAkwU
      # Security settings to restrict file access for n8n workflows
      - N8N_RESTRICT_FILE_ACCESS_TO="/home/node/data"
      # Allows Execute and Read/Write access to /home/node/data for n8n workflows, but prevents access to other parts of the container filesystem for better security
      - NODES_EXCLUDE="[]"
      # Allows expressions to read variables
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - ./data/sandbox:/home/node/data:Z
      - ./data/n8n:/home/node/.n8n:Z
      - ./config/n8n/package.json:/data/package.json:ro,Z
      - ./credentials:/home/node/.n8n/credentials:ro,Z
      - ./certs:/app/certs:ro,Z
    ports:
      - "5678:5678"
    networks:
      - toolkit-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # SearXNG Meta Search Engine
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: dc-masters-searxng
    environment:
      - SEARXNG_BASE_URL=http://host.docker.internal/
      - UWSGI_WORKERS=4
      - UWSGI_THREADS=4
      # Corporate firewall / SSL settings
      - REQUESTS_CA_BUNDLE=/etc/searxng/certs/company-ca.pem
      - SSL_CERT_FILE=/etc/searxng/certs/company-ca.pem
      - CURL_CA_BUNDLE=/etc/searxng/certs/company-ca.pem
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY:-postgres,litellm,mcp-searxng}
    volumes:
      - ./config/searxng:/etc/searxng:ro,Z
      - ./data/searxng:/var/lib/searxng:rw,Z
      - ./certs:/etc/searxng/certs:ro,Z
    ports:
      - "8080:8080"
    networks:
      - toolkit-network
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: unless-stopped

  # MCP Server - SearXNG Search (HTTP Transport)
  mcp-searxng:
    build:
      context: .
      dockerfile: mcp-servers/searxng/Dockerfile
    container_name: dc-masters-mcp-searxng
    environment:
      - SEARXNG_URL=http://searxng:8080
      - MCP_HTTP_PORT=8081
      # Corporate firewall / SSL settings
      - NODE_TLS_REJECT_UNAUTHORIZED=${DC_NODE_TLS_REJECT_UNAUTHORIZED}
      - NODE_EXTRA_CA_CERTS=${DC_NODE_EXTRA_CA_CERTS:-/app/certs/company-ca.pem}
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY:-postgres,litellm,searxng}
    volumes:
      - ./certs:/app/certs:ro,Z
    ports:
      - "8081:8081"
    networks:
      - toolkit-network
    depends_on:
      - searxng
    restart: unless-stopped

networks:
  toolkit-network:
    driver: bridge
